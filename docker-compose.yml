services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-}
    ports:
      - "127.0.0.1:9000:9000"  # proxied via caddy
      - "127.0.0.1:9001:9001"  # admin console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cloud:${DB_PASSWORD}@postgres:5432/cloud?sslmode=disable
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_URL: postgres://cloud:${DB_PASSWORD}@postgres:5432/cloud?sslmode=disable
      REDIS_URL: redis://redis:6379/0

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}

      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}

      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-blobs}
      MINIO_USE_SSL: "false"
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PRESIGN_TTL: ${MINIO_PRESIGN_TTL:-1h}

      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-0}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES:-0}
      TRASH_TTL: ${TRASH_TTL:-720h}

      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
  minio-data:

